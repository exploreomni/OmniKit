name: Security checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Per-PR gate. Static type checks plus the bounded JavaScript dependency and
  # application-security checks run for every pull request and push to main.
  security-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static type checks
        run: npm run typecheck && npm run typecheck:node

      - name: Verify canonical release-gate coverage
        run: npm run test:release-gate-coverage

      - name: Run the security gate
        run: npm run security:gate

  # Full suite, on demand and weekly. It repeats the static checks and adds the
  # lint, build, bundle budgets, every unit contract, and the Playwright suite.
  # Run it from the Actions tab before a release, or let the Monday cron catch
  # drift.
  full-gate:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run canonical security and release gate
        run: npm run security:check
